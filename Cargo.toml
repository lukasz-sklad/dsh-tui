[package]
name = "dsh-tui"
version = "0.3.0"
edition = "2024"
description = "Terminal chat client driving dsh --profile sdk over the NDJSON JSON-RPC stdio protocol."
license = "MIT"
repository = "https://github.com/lukasz-sklad/dsh-tui"
homepage = "https://github.com/lukasz-sklad/dsh-tui"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
