name: CI & Flatpak (Flathub-ready)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust Tests & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

  flatpak:
    name: Build Flatpak from Source (Flathub Offline Mode)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cargo-sources.json is up to date
        run: |
          cp packaging/flatpak/cargo-sources.json /tmp/cargo-sources.expected.json
          python3 packaging/flatpak/generate-cargo-sources.py
          diff -u /tmp/cargo-sources.expected.json packaging/flatpak/cargo-sources.json

      - name: Install Flatpak & AppStream validators
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils appstream

      - name: Validate Desktop & AppStream metadata
        run: |
          desktop-file-validate packaging/flatpak/io.github.lukasz_sklad.dsh_tui.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.lukasz_sklad.dsh_tui.metainfo.xml

      - name: Install Freedesktop 26.08 Runtime, SDK & rust-stable
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Build Flatpak bundle offline from source
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-dir packaging/flatpak/io.github.lukasz_sklad.dsh_tui.yml
          flatpak build-bundle repo dsh-tui-x86_64.flatpak io.github.lukasz_sklad.dsh_tui

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tui-x86_64-flatpak
          path: dsh-tui-x86_64.flatpak
          if-no-files-found: error
