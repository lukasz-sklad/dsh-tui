name: CI & Flatpak

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test & Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tui-linux-x86_64
          path: target/release/dsh-tui
          if-no-files-found: error

  flatpak:
    name: Build Flatpak Bundle (x86_64)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: dsh-tui-linux-x86_64
          path: target/release

      - name: Mark binary executable
        run: chmod +x target/release/dsh-tui

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install Freedesktop 26.08 Runtime & SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Build Flatpak bundle
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=repo build-dir packaging/flatpak/io.github.lukasz_sklad.dsh_tui.yml
          flatpak build-bundle repo dsh-tui-x86_64.flatpak io.github.lukasz_sklad.dsh_tui

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tui-x86_64-flatpak
          path: dsh-tui-x86_64.flatpak
          if-no-files-found: error
